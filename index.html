<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flex Mission</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <div class="app">

        <header class="header">
            <h1>🚀 Flex Mission</h1>

            <p>
                Learn Flexbox by arranging the space crew correctly.
            </p>
        </header>


        <main>

            <section class="game-panel">

                <div class="status-bar">
                    <span id="level-indicator">Level 1 of 6</span>
                    <span id="attempt-counter">Attempts: 0</span>
                </div>

                <h2 id="level-title">Mission 1</h2>

                <p id="instruction">
                    Move the space crew to the center of the board.
                </p>


                <div class="board-wrapper">

                    <div id="game-board" class="game-board">

                        <div class="game-item">🚀</div>
                        <div class="game-item">👨‍🚀</div>
                        <div class="game-item">🛰️</div>

                    </div>

                </div>

            </section>


            <section class="controls-panel">

                <h2>Flexbox Controls</h2>

                <div class="controls">

                    <label>
                        flex-direction

                        <select id="flex-direction">
                            <option value="row">row</option>
                            <option value="row-reverse">row-reverse</option>
                            <option value="column">column</option>
                            <option value="column-reverse">column-reverse</option>
                        </select>
                    </label>


                    <label>
                        justify-content

                        <select id="justify-content">
                            <option value="flex-start">flex-start</option>
                            <option value="center">center</option>
                            <option value="flex-end">flex-end</option>
                            <option value="space-between">space-between</option>
                            <option value="space-around">space-around</option>
                            <option value="space-evenly">space-evenly</option>
                        </select>
                    </label>


                    <label>
                        align-items

                        <select id="align-items">
                            <option value="flex-start">flex-start</option>
                            <option value="center">center</option>
                            <option value="flex-end">flex-end</option>
                            <option value="stretch">stretch</option>
                        </select>
                    </label>


                    <label>
                        flex-wrap

                        <select id="flex-wrap">
                            <option value="nowrap">nowrap</option>
                            <option value="wrap">wrap</option>
                            <option value="wrap-reverse">wrap-reverse</option>
                        </select>
                    </label>

                </div>


                <div class="buttons">

                    <button id="check-button">
                        Check Solution
                    </button>

                    <button id="reset-button" class="secondary">
                        Reset
                    </button>

                    <button id="next-button" class="next" disabled>
                        Next Mission
                    </button>

                </div>


                <p id="feedback" class="feedback">
                    Choose the Flexbox properties and check your solution.
                </p>

            </section>

        </main>


        <footer>
            Flex Mission • Flexbox Learning Game
        </footer>

    </div>

</body>

</html>
